spring:
  application:
    name: decisionflow

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format-sql: true

server:
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${JWT_SECRET}
